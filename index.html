<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地址检测</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        #info {
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            min-width: 300px;
        }
        #info h1 {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div id="info">
        <h1>正在检测</h1>
        <p id="location-info"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 使用新的、支持 HTTPS 的 API: api.country.is
            fetch('https://api.country.is/')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应失败: ' + response.statusText);
                    }
                    return response.json();
                })
                .then(data => {
                    // 调试：在控制台打印 API 返回的完整数据
                    console.log('API 响应:', data); 
                    // data 结构: {"ip": "xxx.xxx.xxx.xxx", "country": "US"}

                    // 检查国家代码是否为 'CN' (中国)
                    // 注意：这个 API 的字段是 'country'，不是 'countryCode'
                    if (data.country === 'CN') {
                        // 如果是中国内地 IP，则跳转
                        document.getElementById('location-info').innerText = '您正在从内地访问，即将跳转...';
                        window.location.href = 'https://wangzhi.icu';
                    } else {
                        // 如果不是，则显示 IP 和国家信息
                        document.getElementById('info').innerHTML = `
                            <h1>欢迎！</h1>
                            <p>您似乎不在中国内地</p>
                            <p><strong>IP:</strong> ${data.ip}</p>
                            <p><strong>国家代码:</strong> ${data.country}</p>
                        `;
                    }
                })
                .catch(error => {
                    // 处理 API 请求失败的情况
                    console.error('检测失败:', error);
                    document.getElementById('info').innerHTML = `
                        <h1>检测失败</h1>
                        <p>无法连接到检测服务。</p>
                        <p>${error.message}</p>
                    `;
                });
        });
    </script>

</body>
</html>
