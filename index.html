<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP 地址检测</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        #info {
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        #info h1 {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div id="info">
        <h1>正在检测您的 IP 地址...</h1>
        <p id="location-info"></p>
    </div>

    <script>
        // 当页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 使用 fetch API 请求 ip-api.com
            // 这个 API 会返回发出请求的 IP 的地理位置信息
            fetch('https://ip-api.com/json/')
                .then(response => response.json()) // 将响应解析为 JSON
                .then(data => {
                    // data 对象包含如: status, country, countryCode, city, ip 等
                    
                    // 检查国家代码是否为 'CN' (中国)
                    if (data.countryCode === 'CN') {
                        // 如果是中国内地 IP，则跳转
                        document.getElementById('location-info').innerText = '您正在从中国访问，即将跳转...';
                        window.location.href = 'https://wangzhi.icu';
                    } else {
                        // 如果不是，则显示 IP 和地址信息
                        document.getElementById('info').innerHTML = `
                            <h1>欢迎！</h1>
                            <p>您的 IP 地址似乎不在中国内地。</p>
                            <p><strong>IP:</strong> ${data.query}</p>
                            <p><strong>位置:</strong> ${data.city}, ${data.regionName}, ${data.country}</p>
                        `;
                    }
                })
                .catch(error => {
                    // 处理 API 请求失败的情况
                    console.error('IP 地址检测失败:', error);
                    document.getElementById('location-info').innerText = '无法检测您的 IP 地址信息。';
                });
        });
    </script>

</body>
</html>
